name: Build & Download Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Keystore & Environment
        run: |
          # Prepare debug keystore for signing
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              echo "Decoding debug.keystore from base64..."
              base64 -d debug.keystore.base64 > debug.keystore
            else
              echo "Generating new debug keystore..."
              keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

          # Prepare .env from .env.example if missing
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi

          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK for Easy Identification
        run: |
          mkdir -p build-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk build-artifacts/1-To-Many-Universal-Social-Broadcaster.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 1-To-Many-Android-APK
          path: build-artifacts/1-To-Many-Universal-Social-Broadcaster.apk
          retention-days: 30

      - name: Build Summary
        run: |
          echo "### 🚀 APK Build Succeeded!" >> $GITHUB_STEP_SUMMARY
          echo "The Android APK is compiled and ready for download." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. Go to the **Summary** tab of this GitHub Actions run." >> $GITHUB_STEP_SUMMARY
          echo "2. Scroll down to **Artifacts**." >> $GITHUB_STEP_SUMMARY
          echo "3. Click **1-To-Many-Android-APK** to download the APK file." >> $GITHUB_STEP_SUMMARY
          echo "4. Transfer to any Android phone and install." >> $GITHUB_STEP_SUMMARY
